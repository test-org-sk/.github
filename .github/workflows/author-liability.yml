name: Author liability notice
on:
  workflow_call:
    inputs:
      team_slug: { type: string, required: true }

permissions:
  pull-requests: write
  issues: write

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const org = context.repo.owner;
            const team = '${{ inputs.team_slug }}';
            const author = context.payload.pull_request.user.login;
            const pr = context.payload.pull_request.number;
            const marker = '<!-- liability-notice -->';
            const label = 'external-author: liability notice';

            let isMember = false;
            try {
              const { data } = await github.rest.teams.getMembershipForUserInOrg({
                org, team_slug: team, username: author });
              isMember = data.state === 'active';
            } catch (e) { if (e.status !== 404) throw e; }

            const comments = await github.paginate(github.rest.issues.listComments,
              { ...context.repo, issue_number: pr });
            const existing = comments.find(c => c.body.includes(marker));

            if (isMember) {
              if (existing) await github.rest.issues.deleteComment({ ...context.repo, comment_id: existing.id });
              try { await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr, name: label }); } catch {}
              return;
            }

            const body = `${marker}\n> [!CAUTION]\n> **Liability notice:** this PR was opened by @${author}, who is not a member of our certified developer team. ` +
              `Code in this PR (including code produced with Odoo's AI/"vibe coding" editor) has not been authored under our quality assurance. ` +
              `Merging or deploying it to the client's Odoo.sh instance is at the sole responsibility of the author and the client. Review by a team member is required before merge.`;

            if (!existing) await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            try { await github.rest.issues.getLabel({ ...context.repo, name: label }); }
            catch { await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'B60205' }); }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: pr, labels: [label] });
